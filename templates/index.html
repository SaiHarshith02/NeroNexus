<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Titanic Survival Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card p-4 shadow-lg rounded-4">
    <h2 class="text-center mb-4">🚢 Titanic Survival Predictor</h2>
    <form action="/predict" method="post">

      <div class="mb-3">
        <label for="pclass" class="form-label">Passenger Class (1 = 1st, 2 = 2nd, 3 = 3rd)</label>
        <select class="form-select" id="pclass" name="pclass" required>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Sex</label>
        <select class="form-select" name="sex" required>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="sibsp" class="form-label">Number of Siblings/Spouses Aboard</label>
        <input type="number" class="form-control" name="sibsp" id="sibsp" min="0" required>
      </div>

      <div class="mb-3">
        <label for="parch" class="form-label">Number of Parents/Children Aboard</label>
        <input type="number" class="form-control" name="parch" id="parch" min="0" required>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary btn-lg">Predict</button>
      </div>
    </form>

    {% if prediction_text %}
    <div class="alert alert-info text-center mt-4">
      {{ prediction_text }}
    </div>
    {% endif %}
  </div>
</div>

</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    {% if prediction_text %}
      Swal.fire({
        title: 'Prediction Result',
        text: '{{ prediction_text }}',
        icon: 'info',
        confirmButtonText: 'OK'
      });
    {% endif %}
  });
</script>
